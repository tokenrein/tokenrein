[package]
name = "tokenrein"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "tokenrein"
path = "src/lib.rs"

[[bin]]
name = "tokenrein"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
duckdb = { version = "=1.20000.0", features = ["bundled", "parquet"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager", "streams"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "macros", "migrate", "json", "chrono"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
