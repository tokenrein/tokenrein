name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-latest
    env:
      TL_REQUIRE_REDIS: "1"
      TL_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tests start their own throwaway redis-server and Postgres (initdb) on free ports.
      - name: Install redis-server and Postgres
        run: sudo apt-get update && sudo apt-get install -y redis-server postgresql
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  sdk-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  sdk-typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Known-vulnerability checks for every dependency tree, and an SBOM of the repository.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit (proxy)
        run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (sdk/typescript)
        working-directory: sdk/typescript
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit (sdk/python, with its optional and test dependencies)
        working-directory: sdk/python
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --quiet --upgrade pip pip-audit
          /tmp/audit-venv/bin/pip install --quiet -e ".[openai,anthropic,test]"
          /tmp/audit-venv/bin/pip-audit --skip-editable
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: tokenlens-sbom.cdx.json
          artifact-name: tokenlens-sbom.cdx.json
