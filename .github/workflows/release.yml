name: release

# Push a tag like v0.1.0 to release. The tag must match the versions in proxy/Cargo.toml,
# sdk/python/pyproject.toml and sdk/typescript/package.json.
#
# - The container image always goes to ghcr.io/<owner>/tokenlens (linux/amd64 and linux/arm64).
# - The Python SDK goes to PyPI only if the PYPI_TOKEN secret is set.
# - The TypeScript SDK goes to npm only if the NPM_TOKEN secret is set.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      pypi: ${{ steps.s.outputs.pypi }}
      npm: ${{ steps.s.outputs.npm }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package versions
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' proxy/Cargo.toml | head -1)
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/python/pyproject.toml | head -1)
          js=$(node -p 'require("./sdk/typescript/package.json").version')
          echo "tag=$tag proxy=$cargo python=$py typescript=$js"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$py" ] && [ "$tag" = "$js" ] || {
            echo "::error::tag v$tag does not match proxy $cargo / python $py / typescript $js"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag] section"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Which registries have tokens
        id: s
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "pypi=$([ -n "$PYPI_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "npm=$([ -n "$NPM_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 is built under QEMU, which is slow for Rust; native arm64 runners can replace it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tokenlens
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pypi:
    needs: verify
    if: needs.verify.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test and build
        working-directory: sdk/python
        run: |
          pip install build -e ".[test]"
          python -m pytest -q
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          password: ${{ secrets.PYPI_TOKEN }}

  npm:
    needs: verify
    if: needs.verify.outputs.npm == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Add --provenance once the repository is public (npm requires a public source repo).
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\nImage: `ghcr.io/%s/tokenlens:%s`\n' "${{ github.repository_owner }}" "$VERSION" >> notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
