name: release

# Push a tag like v0.1.0 to release. The tag must match the versions in proxy/Cargo.toml,
# sdk/python/pyproject.toml and sdk/typescript/package.json.
#
# - The container image always goes to ghcr.io/<owner>/tokenrein (linux/amd64 and linux/arm64,
#   each built on a native runner).
# - The SDKs go to PyPI and npm through trusted publishing (OpenID Connect, no stored tokens),
#   once the repository variables PUBLISH_PYPI / PUBLISH_NPM are "true". Each registry must list
#   this repository and release.yml as a trusted publisher first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package versions
        id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' proxy/Cargo.toml | head -1)
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/python/pyproject.toml | head -1)
          js=$(node -p 'require("./sdk/typescript/package.json").version')
          echo "tag=$tag proxy=$cargo python=$py typescript=$js"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$py" ] && [ "$tag" = "$js" ] || {
            echo "::error::tag v$tag does not match proxy $cargo / python $py / typescript $js"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$tag] section"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  # Each platform builds on its own native runner (under QEMU, arm64 took about 6 hours) and is
  # pushed by digest; image-manifest then tags one multi-platform image from the digests.
  image:
    needs: verify
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tokenrein
          # GitHub reports the repository license as NOASSERTION; name it.
          labels: org.opencontainers.image.licenses=Elastic-2.0
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/tokenrein,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tokenrein
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Tag the multi-platform image
        working-directory: digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/tokenrein
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  pypi:
    needs: verify
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test and build
        working-directory: sdk/python
        run: |
          pip install build -e ".[test]"
          python -m pytest -q
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  npm:
    needs: verify
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Trusted publishing: no stored token. npm adds a provenance statement on its own when the
      # repository is public.
      - run: npm publish --access public

  github-release:
    needs: [verify, image-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\nImage: `ghcr.io/%s/tokenrein:%s`\n' "${{ github.repository_owner }}" "$VERSION" >> notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
