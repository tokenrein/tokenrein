{{- if not .Values.secrets.existingSecret }}
{{- /* Values first, then what an earlier install generated, then new random values. */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "tokenlens.fullname" .)).data | default dict }}
{{- $adminToken := .Values.secrets.adminToken | default (get $existing "TL_ADMIN_TOKEN" | b64dec) | default (randAlphaNum 40) }}
{{- $secretsKey := .Values.secrets.secretsKey | default (get $existing "TL_SECRETS_KEY" | b64dec) | default (randAlphaNum 64 | sha256sum) }}
{{- $pgPassword := .Values.postgresql.password | default (get $existing "TL_POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tokenlens.fullname" . }}
  labels:
    {{- include "tokenlens.labels" . | nindent 4 }}
  annotations:
    # Losing TL_SECRETS_KEY makes the provider keys saved in the dashboard unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  TL_ADMIN_TOKEN: {{ $adminToken | b64enc | quote }}
  TL_SECRETS_KEY: {{ $secretsKey | b64enc | quote }}
  {{- with .Values.secrets.previousSecretsKey }}
  TL_SECRETS_KEY_PREVIOUS: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  TL_POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  TL_DATABASE_URL: {{ printf "postgres://tokenlens:%s@%s:5432/tokenlens" $pgPassword (include "tokenlens.postgresHost" .) | b64enc | quote }}
  {{- else if .Values.externalDatabase.url }}
  TL_DATABASE_URL: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
