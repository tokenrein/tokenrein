# Default values for the Tokenrein chart. See docs/install.md.

replicaCount: 2

# The dashboard's address as people reach it (https://tokenrein.example.com): used in alert
# links, password setup links and single sign-on redirects.
publicUrl: ""

image:
  repository: ghcr.io/tokenrein/tokenrein
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The proxy's TOML config, mounted at /etc/tokenrein/tokenrein.toml. Listen addresses, the Redis
# URL and the secrets below are set by the chart from the environment and override this file.
# Orgs, projects, keys and budgets are managed in the dashboard and stored in Postgres.
config: |
  [server]
  listen = "0.0.0.0:8787"
  admin_listen = "0.0.0.0:8788"
  admin_token_env = "TOKENREIN_ADMIN_TOKEN"
  secrets_key_env = "TOKENREIN_SECRETS_KEY"
  upstream_timeout_secs = 600
  default_max_output_tokens = 4096

  [redis]
  url = "redis://127.0.0.1:6379"

  [database]
  url_env = "TOKENREIN_DATABASE_URL"
  max_connections = 10

  [providers.openai]
  base_url = "https://api.openai.com"
  api_key_env = "OPENAI_API_KEY"

  [providers.anthropic]
  base_url = "https://api.anthropic.com"
  api_key_env = "ANTHROPIC_API_KEY"

secrets:
  # An existing Secret holding TOKENREIN_ADMIN_TOKEN, TOKENREIN_SECRETS_KEY and, when a database is used,
  # TOKENREIN_DATABASE_URL (plus TOKENREIN_POSTGRES_PASSWORD for the bundled Postgres, and
  # TOKENREIN_SECRETS_KEY_PREVIOUS while rotating). Recommended for production.
  existingSecret: ""
  # Without existingSecret the chart creates the Secret from these values. Empty values are
  # generated on first install and kept on upgrades. The Secret is kept on uninstall: without
  # TOKENREIN_SECRETS_KEY, provider keys saved in the dashboard cannot be decrypted.
  adminToken: ""
  # 64 hex characters (openssl rand -hex 32).
  secretsKey: ""
  # Set during a key rotation; see docs/operations.md.
  previousSecretsKey: ""
  # With existingSecret and mountAsFiles: set while the Secret holds TOKENREIN_SECRETS_KEY_PREVIOUS.
  rotating: false
  # Mount the Secret as files and pass TOKENREIN_*_FILE instead of environment variables.
  mountAsFiles: false

# An existing Secret with OPENAI_API_KEY and/or ANTHROPIC_API_KEY, used for every org that has
# no key saved in the dashboard. Optional.
providerKeys:
  existingSecret: ""

# Bundled single-node Redis, for evaluation. In production use a managed or HA Redis
# (externalRedis) with persistence and maxmemory-policy noeviction.
redis:
  enabled: true
  image: docker.io/library/redis:7.4-alpine
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

externalRedis:
  # redis://[:password@]host:6379[/db]. TLS (rediss://) is not supported yet. Ignored when
  # redis.enabled.
  url: ""
  # Or take the URL from a Secret (when it holds a password).
  existingSecret: ""
  existingSecretKey: TOKENREIN_REDIS_URL

# Bundled single-node Postgres 17, for evaluation. In production use a managed Postgres
# (externalDatabase) with backups.
postgresql:
  enabled: true
  image: docker.io/library/postgres:17-alpine
  # Letters and digits only (it is put into a URL). Generated when empty.
  password: ""
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

externalDatabase:
  # Use a Postgres you run. Its URL goes in the Secret as TOKENREIN_DATABASE_URL: either in
  # secrets.existingSecret, or set url here and the chart puts it in the Secret it creates.
  enabled: false
  url: ""

service:
  type: ClusterIP
  # Agents and SDKs.
  proxyPort: 8787
  annotations: {}

adminService:
  # Dashboard, admin API, /metrics. Keep it internal; expose it through your SSO-protected ingress.
  type: ClusterIP
  port: 8788
  annotations: {}

# Usage history for spend reports past 40 days, CSV exports and run timelines older than 7 days:
# Parquet files read with DuckDB, on a volume every replica writes to. With more than one
# replica it needs ReadWriteMany storage (EFS, Filestore, Azure Files, NFS, CephFS), or an
# existingClaim of that kind.
history:
  enabled: false
  retentionDays: 400
  persistence:
    existingClaim: ""
    accessModes: [ReadWriteMany]
    size: 20Gi
    storageClass: ""

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 512Mi

livenessProbe:
  httpGet: { path: /healthz, port: proxy }
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# /healthz rather than /readyz: /readyz fails while Redis or Postgres is down, and taking every
# pod out of the Service then would refuse traffic even for orgs that fail open.
readinessProbe:
  httpGet: { path: /healthz, port: proxy }
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# A new pod gets traffic only once it has reached Redis and Postgres.
startupProbe:
  httpGet: { path: /readyz, port: admin }
  periodSeconds: 2
  timeoutSeconds: 3
  failureThreshold: 60

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

metrics:
  # prometheus.io/* annotations on the pods.
  podAnnotations: true
  serviceMonitor:
    # Needs the Prometheus Operator CRDs.
    enabled: false
    interval: 30s
    labels: {}

# Extra environment for the container, e.g. a license key from a Secret (docs/licensing.md):
#   - name: TOKENREIN_LICENSE
#     valueFrom: { secretKeyRef: { name: tokenrein-license, key: key } }
extraEnv: []
podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile: { type: RuntimeDefault }

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
