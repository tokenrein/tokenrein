apiVersion: v1
kind: Service
metadata:
  name: {{ include "tokenrein.fullname" . }}
  labels:
    {{- include "tokenrein.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tokenrein.selectorLabels" . | nindent 4 }}
  ports:
    - name: proxy
      port: {{ .Values.service.proxyPort }}
      targetPort: proxy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tokenrein.fullname" . }}-admin
  labels:
    {{- include "tokenrein.labels" . | nindent 4 }}
    app.kubernetes.io/part: admin
  {{- with .Values.adminService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.adminService.type }}
  selector:
    {{- include "tokenrein.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.adminService.port }}
      targetPort: admin
