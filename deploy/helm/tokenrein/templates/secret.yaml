{{- if not .Values.secrets.existingSecret }}
{{- /* Values first, then what an earlier install generated, then new random values. */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "tokenrein.fullname" .)).data | default dict }}
{{- $adminToken := .Values.secrets.adminToken | default (get $existing "TOKENREIN_ADMIN_TOKEN" | b64dec) | default (randAlphaNum 40) }}
{{- $secretsKey := .Values.secrets.secretsKey | default (get $existing "TOKENREIN_SECRETS_KEY" | b64dec) | default (randAlphaNum 64 | sha256sum) }}
{{- $pgPassword := .Values.postgresql.password | default (get $existing "TOKENREIN_POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tokenrein.fullname" . }}
  labels:
    {{- include "tokenrein.labels" . | nindent 4 }}
  annotations:
    # Losing TOKENREIN_SECRETS_KEY makes the provider keys saved in the dashboard unreadable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  TOKENREIN_ADMIN_TOKEN: {{ $adminToken | b64enc | quote }}
  TOKENREIN_SECRETS_KEY: {{ $secretsKey | b64enc | quote }}
  {{- with .Values.secrets.previousSecretsKey }}
  TOKENREIN_SECRETS_KEY_PREVIOUS: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  TOKENREIN_POSTGRES_PASSWORD: {{ $pgPassword | b64enc | quote }}
  TOKENREIN_DATABASE_URL: {{ printf "postgres://tokenrein:%s@%s:5432/tokenrein" $pgPassword (include "tokenrein.postgresHost" .) | b64enc | quote }}
  {{- else if .Values.externalDatabase.url }}
  TOKENREIN_DATABASE_URL: {{ .Values.externalDatabase.url | b64enc | quote }}
  {{- end }}
{{- end }}
