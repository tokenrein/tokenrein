# helm lint / template check: external Redis and Postgres, secrets from an existing Secret,
# mounted as files, with autoscaling and a ServiceMonitor.
secrets:
  existingSecret: tokenrein-secrets
  mountAsFiles: true
providerKeys:
  existingSecret: tokenrein-provider-keys
redis:
  enabled: false
externalRedis:
  existingSecret: tokenrein-redis
postgresql:
  enabled: false
externalDatabase:
  enabled: true
autoscaling:
  enabled: true
metrics:
  serviceMonitor:
    enabled: true
