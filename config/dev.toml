# Local development config for the Tokenrein proxy.
# Needs OPENAI_API_KEY and ANTHROPIC_API_KEY in the environment (remove a provider block to skip it).
# Make customer keys with: cargo run -p tokenrein -- gen-key

[server]
listen = "127.0.0.1:8787"
admin_listen = "127.0.0.1:8788"
admin_token_env = "TOKENREIN_ADMIN_TOKEN"
upstream_timeout_secs = 600
default_max_output_tokens = 4096

[redis]
url = "redis://127.0.0.1:6379"

# Optional: Postgres keeps every config version and the audit log (otherwise both stay in Redis).
# The URL is read from this env var, e.g. TOKENREIN_DATABASE_URL=postgres://tokenrein:...@localhost/tokenrein
# [database]
# url_env = "TOKENREIN_DATABASE_URL"
# max_connections = 10

# Optional: usage history for spend past 40 days, CSV exports and old run timelines (Parquet
# files read with DuckDB). Replicas share the folder.
# [history]
# dir = "./data/history"
# retention_days = 400

# Optional: people sign in with their own accounts (needs the database). public_url is the
# dashboard's address as people reach it; single sign-on sends them back there.
# [auth]
# public_url = "https://tokenrein.example.com"
# session_hours = 12
# idle_minutes = 120
# password_login = true

[providers.openai]
base_url = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"

[providers.anthropic]
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# Prices for models missing from the built-in list, or that changed since it was checked:
# [[pricing]]
# provider = "anthropic"
# model = "claude-sonnet-5"
# input_per_mtok = 3.0
# output_per_mtok = 15.0

[[orgs]]
id = "demo"
fail_mode = "open"

# Policies inherit org -> project. Modes: skip | check (shadow: allow + warn) | enforce.
[orgs.budgets]
org_monthly = { limit_usd = 200.0, mode = "enforce" }
project_monthly = { limit_usd = 100.0, mode = "enforce" }
agent_daily = { limit_usd = 20.0, mode = "check" }
run = { limit_usd = 2.0, mode = "check" }
max_run_usd = 10.0

[[orgs.projects]]
id = "support-bot"
# sha256 of the dev-only key "tr_dev_support_bot_key_change_me"; never use it outside local dev.
virtual_key_hashes = ["9cbe3babaad4beb8958eb61b5459917880673dc29dec664c1b40d6a689b2b55a"]
